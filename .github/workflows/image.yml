# OPM SD7 · Publishing Container Image: push the API/MCP/dashboard image to ghcr.io (R5 packaging).
# Deploying it anywhere (Cloud Run / Fly.io / Render, see project/deploy/) is a manual step, not done here.
name: image

on:
  push:
    branches: [main]
    paths: ["project/**"]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: build + push ghcr.io image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image name (ghcr.io requires lowercase)
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/driftrev" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: project
          file: project/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    name: run the pushed image
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Import the package inside the pushed image
        run: |
          img="${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}"
          docker pull "$img"
          docker run --rm "$img" python -c "import driftrev.pipeline, driftrev.api, driftrev.mcp_server, lightgbm, xgboost, streamlit; print('image ok')"
      - name: API answers /health
        run: |
          img="${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}"
          docker run -d --name api -p 8000:8000 -e DRIFTREV_API_TOKEN=ci-token "$img"
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && exit 0; sleep 2; done
          docker logs api; exit 1
