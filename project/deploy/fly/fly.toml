# Fly.io (TEMPLATE, not deployed). From project/: fly launch --no-deploy --copy-config --config deploy/fly/fly.toml
#   fly volumes create driftrev_data --size 3 --region iad
#   fly secrets set DRIFTREV_API_TOKEN=... SEC_USER_AGENT="Your Name you@example.com"
#   fly deploy --config deploy/fly/fly.toml --image ghcr.io/OWNER/driftrev:latest
app = "driftrev-api"
primary_region = "iad"

[build]
  image = "ghcr.io/OWNER/driftrev:latest"

[env]
  DRIFTREV_DATA_DIR = "/data"
  ALPACA_PAPER = "true"
  DRIFTREV_ALLOW_ORDERS = "false"

[processes]
  # one machine owns the volume, so the scheduler (daily pipeline, 22:30 ET) runs beside the API in the same machine
  api = "sh -c 'python -m driftrev.scheduler & exec uvicorn driftrev.api:app --host 0.0.0.0 --port 8000'"

[mounts]
  source = "driftrev_data"
  destination = "/data"
  processes = ["api"]          # a Fly volume attaches to ONE machine: keep API + writer together (see README)

[http_service]
  processes = ["api"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
